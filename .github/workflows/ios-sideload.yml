name: iOS sideload build

on:
  push:
    paths: ['platforms/ios/**', 'shared/**', 'scripts/ios/**', '.github/workflows/ios-sideload.yml']
  pull_request:
    paths: ['platforms/ios/**', 'shared/**', 'scripts/ios/**', '.github/workflows/ios-sideload.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-sideload-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare Xcode project
        run: |
          command -v xcodegen || brew install xcodegen
          xcodebuild -version
          swift test --package-path platforms/ios
          if [ -d shared/direct_map ]; then swift test --package-path shared/direct_map; fi
          xcodegen generate --spec platforms/ios/project.yml
      - name: Select available iPhone simulator
        id: simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))['devices']
          iphones = [d for runtime, values in devices.items() if 'iOS' in runtime for d in values if 'iPhone' in d['name']]
          if not iphones:
              raise SystemExit('No iPhone simulator is installed')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('id=' + next((d for d in iphones if d['name'] == 'iPhone Duo'), iphones[0])['udid'] + '\n')
          PY
      - name: App unit tests and offline gateway UI tests
        run: |
          xcodebuild test -project platforms/ios/MotoGPS.xcodeproj -scheme MotoGPS \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath build/ios-tests -resultBundlePath build/GatewayTests.xcresult \
            -only-testing:MotoGPSUnitTests -only-testing:MotoGPSUITests \
            CODE_SIGNING_ALLOWED=NO
      - name: Export UI screenshots
        if: always()
        run: |
          if [ -d build/GatewayTests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/GatewayTests.xcresult --output-path build/ui-screenshots
          fi
      - name: Upload test results and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iOS-test-results
          path: |
            build/GatewayTests.xcresult
            build/ui-screenshots
          retention-days: 14

  device-ipa:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare project generator and optional official SDK
        run: |
          command -v xcodegen || brew install xcodegen
          if [ -f scripts/prepare-amap-sdk.py ]; then python3 scripts/prepare-amap-sdk.py; fi
      - name: Build unsigned IPA for re-signing
        run: scripts/ios/build_sideload_ipa.sh
      - name: Upload IPA and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MOTO-GPS-unsigned-IPA
          path: |
            build/sideload/*.ipa
            build/sideload/SHA256SUMS.txt
          if-no-files-found: error
